name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --group lint ruff check .
      - run: uv run --group lint ruff format --check .

  tests:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep in sync with "homeassistant" in hacs.json.
          - name: HA 2026.2.3 (minimum)
            harness: "pytest-homeassistant-custom-component==0.13.316"
          - name: latest HA
            harness: "pytest-homeassistant-custom-component"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --isolated --no-project --python ">=3.14.2" --with "${{ matrix.harness }}" pytest
